[project]
name = "life-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4", "Flask-SQLAlchemy>=3.1,<4", "Flask-Migrate>=4,<5", "Flask-WTF>=1.2,<2", "openpyxl>=3.1,<4", "PyYAML>=6,<7", "python-dotenv>=1,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = ["config", "config.*", "tests", "tests.*"]
