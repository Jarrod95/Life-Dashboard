{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static',filename='css/strength.css') }}">
<section class="strength">
  <div class="strength-heading"><div><p class="eyebrow">FITNESS / PERFORMANCE</p><h1>Strength training</h1><p class="muted">Explore your sessions, training load, progress and records from Gym Day.</p></div><a class="button" href="/fitness/strength/data">Source health</a></div>
  <nav class="strength-tabs" aria-label="Strength views">
    <a href="/fitness/strength">Overview</a><a href="/fitness/strength/exercises">Exercises</a>
    <a href="/fitness/strength/history">History</a><a href="/fitness/strength/records">Records</a>
    <a href="/fitness/strength/data">Data & sync</a>
  </nav>
  <form id="strength-filters" class="strength-filters">
    <label>Year<select id="gym-year" name="year"><option value="">All years</option></select></label>
    <label>Month<select id="gym-month" name="month"><option value="all">All months</option>{% for month in range(1,13) %}<option value="{{month}}">{{ ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][month-1] }}</option>{% endfor %}</select></label>
    <label>From<input type="date" name="from" id="gym-from"></label>
    <label>To<input type="date" name="to" id="gym-to"></label>
    <button type="submit">Apply</button><button type="button" id="gym-reset" class="subtle">Reset</button>
  </form>
  <p id="gym-error" role="alert" hidden></p>
  <div id="gym-view" aria-live="polite"><p class="muted">Loading strength data…</p></div>
</section>
<script defer src="{{ url_for('static',filename='js/strength.js') }}"></script>
{% endblock %}
